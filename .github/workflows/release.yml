name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  cli:
    name: Build the CLI package
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the CLI version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm --filter @tui-md/core build && pnpm --filter ./apps/cli build
      - run: pnpm pack --pack-destination ../../out
        working-directory: apps/cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: out/*.tgz
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm publish tui-md-viewer-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-packages:
    name: Publish to GitHub Packages
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish under the repository owner's scope
        run: |
          tar -xzf tui-md-viewer-*.tgz
          cd package
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          npm pkg set name="@$owner/tui-md"
          npm publish --ignore-scripts --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Build the desktop app (${{ matrix.os }})
    needs: cli
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the tag as the app version
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: pnpm dist:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    name: Update the Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: out
      - name: Point the formula at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="tui-md-viewer-${version}.tgz"
          sha=$(sha256sum "out/$file" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${file}"
          sed -i -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/tui-md.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(brew): update tui-md to ${version}" || exit 0
          git push
