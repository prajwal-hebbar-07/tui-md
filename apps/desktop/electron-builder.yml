appId: io.github.prajwal-hebbar-07.tui-md
productName: tui-md
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - electron/main.bundle.mjs
  - electron/preload.cjs
  - package.json
extraMetadata:
  main: electron/main.bundle.mjs
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  category: Development
  maintainer: Prajwal Hebbar <prajwalhebbaras@gmail.com>
  target:
    - target: AppImage
      arch: [x64]
